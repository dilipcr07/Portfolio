<!-- CONTACT SECTION -->
<section id="contact" class="container section-wrapper">
    <h2 class="section-title" data-aos="fade-up"><i class="fas fa-envelope"></i> Get In Touch</h2>
    <div class="contact-wrapper">
        <div class="contact-form">
            <h3><i class="fas fa-paper-plane"></i> Send a message</h3>
            <form id="contactForm">
                <!-- Anti-spam Honeypot Field -->
                <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
                <div class="input-group">
                    <input type="text" id="name" name="name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" name="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <textarea id="message" name="message" rows="4" placeholder="Your message..."
                        required></textarea>
                </div>
                <button type="submit" id="submitBtn"><i class="fas fa-paper-plane"></i> Send Secure Msg</button>
                <p id="formFeedback" class="form-feedback"></p>
            </form>
        </div>
        <div class="contact-info">
            <div class="contact-details">
                <h3><i class="fas fa-address-card"></i> Contact Details</h3>
                <div class="contact-item"><i class="fas fa-map-marker-alt"></i>
                    <div><strong>Location</strong><span>Kathmandu, Nepal</span></div>
                </div>
                <div class="contact-item"><i class="fas fa-phone-alt"></i>
                    <div><strong>Phone</strong><span>+977 9841579906</span></div>
                </div>
                <div class="contact-item"><i class="fas fa-envelope"></i>
                    <div><strong>Email</strong><span> dilipcr777@gmail.com</span></div>
                </div>
            </div>
        </div>
    </div>
</section>
